    </text>
  </g>

  <!-- Community Starter -->
  <g filter="url(#shadow)">
    <rect x="1011" y="240" width="300" height="243" rx="28" fill="url(#community)" stroke="#ebcfdc"/>
    <text x="1039" y="295" font-family="Arial, Helvetica, sans-serif" font-size="32">💗</text>
    <text x="1039" y="339" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#6f485c">
      Community Starter
    </text>
    <text x="1039" y="379" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">
