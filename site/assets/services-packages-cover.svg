<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Web Design services, packages, support and maintenance</title>
  <desc id="desc">A feminine pastel services cover showing website packages plus hourly support, a Design and Develop Pack, and monthly maintenance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.52" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eef4ea"/>
    </linearGradient>
    <linearGradient id="community" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8f1"/>
      <stop offset="1" stop-color="#fff2df"/>
    </linearGradient>
    <linearGradient id="support" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8edf5"/>
      <stop offset="1" stop-color="#f5f7ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6d4d5d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="930" rx="44" fill="url(#bg)"/>
  <circle cx="1265" cy="72" r="125" fill="#f4dbe6" opacity="0.7"/>
  <circle cx="95" cy="890" r="150" fill="#f6e7ca" opacity="0.6"/>

