    <text x="966" y="711" font-family="Arial, Helvetica, sans-serif" font-size="28">💗</text>
    <text x="966" y="745" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#fffaf0">Maintenance</text>
    <text x="966" y="780" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#f3c8d9">$100/month</text>
    <text x="966" y="809" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#f1e7ec">3 small fixes + 1 small feature/month</text>
