    <text x="546" y="726" font-family="Arial, Helvetica, sans-serif" font-size="28">✨</text>
    <text x="546" y="760" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#4d3f48">Design &amp; Develop Pack</text>
