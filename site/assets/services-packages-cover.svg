    <text x="734" y="292" font-family="Arial, Helvetica, sans-serif" font-size="31">🛍️</text>
    <text x="734" y="336" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#4d3f48">E-Commerce Starter</text>
    <text x="734" y="378" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#7d9479">from $500</text>
