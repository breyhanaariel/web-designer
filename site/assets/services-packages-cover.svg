    <text x="425" y="323" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#4d3f48">Small Business Site</text>
    <text x="425" y="366" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#b76086">from $200</text>
    <text x="425" y="401" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#766a72">Up to 5 pages</text>
    <text x="425" y="424" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#766a72">custom design · inquiry path</text>
  </g>

