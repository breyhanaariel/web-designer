  <text x="90" y="192" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#74656d">Responsive · accessible · SEO-minded · thoughtfully designed for small businesses and growing brands</text>
  <text x="90" y="238" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#95677d" letter-spacing="2.5">WEBSITE PACKAGES</text>

