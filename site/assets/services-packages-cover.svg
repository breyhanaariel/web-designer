<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 590" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Web Design services and packages</title>
  <desc id="desc">A feminine pastel services cover showing Landing Page, Small Business Site, E-Commerce Starter, and Community Starter packages.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.52" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eef4ea"/>
    </linearGradient>

    <linearGradient id="community" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe8f1"/>
      <stop offset="1" stop-color="#fff2df"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6d4d5d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1400" height="590" rx="44" fill="url(#bg)"/>
  <circle cx="1265" cy="72" r="125" fill="#f4dbe6" opacity="0.7"/>
  <circle cx="95" cy="560" r="145" fill="#f6e7ca" opacity="0.6"/>

  <text x="90" y="88" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95677d" letter-spacing="5">
    WORK WITH ME · SERVICES &amp; PACKAGES
  </text>

  <text x="90" y="158" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#4d3f48">
    Cute websites. Clear business goals. 🎀
  </text>

  <text x="90" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#74656d">
    Responsive · accessible · SEO-minded · thoughtfully designed for small businesses and growing brands
  </text>

  <!-- Landing Page -->
  <g filter="url(#shadow)">
    <rect x="90" y="255" width="285" height="228" rx="28" fill="#fffdf8" stroke="#eadfdc"/>
    <text x="118" y="308" font-family="Arial, Helvetica, sans-serif" font-size="32">✨</text>
    <text x="118" y="352" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#4d3f48">
      Landing Page
    </text>
    <text x="118" y="392" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">
      from $25
    </text>
    <text x="118" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
      1 responsive page
    </text>
    <text x="118" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
      CTA · mobile-ready
    </text>
  </g>

  <!-- Small Business Site -->
  <g filter="url(#shadow)">
    <rect x="397" y="240" width="285" height="243" rx="28" fill="#fffdf9" stroke="#e6d6dc"/>
    <text x="425" y="295" font-family="Arial, Helvetica, sans-serif" font-size="32">🌷</text>
    <text x="425" y="339" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#4d3f48">
      Small Business Site
    </text>
    <text x="425" y="379" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">
      from $200
    </text>
    <text x="425" y="412" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
