    <text x="93" y="315" font-family="Arial, Helvetica, sans-serif" font-size="31">✨</text>
    <text x="93" y="357" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#4d3f48">Landing Page</text>
    <text x="93" y="397" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">from $25</text>
    <text x="93" y="430" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">1 responsive page</text>
    <text x="93" y="453" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">CTA · mobile-ready</text>
