    </text>
    <text x="1039" y="453" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7d6470">
      small businesses
    </text>
  </g>

  <text x="90" y="535" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#95677d">
    View services · compare packages · read the process · start a project →
  </text>
</svg>
