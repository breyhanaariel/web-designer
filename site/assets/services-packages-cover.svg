  <text x="100" y="645" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#4d3f48">Keep your website polished and moving.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="685" width="360" height="165" rx="24" fill="#fff"/>
    <text x="126" y="726" font-family="Arial, Helvetica, sans-serif" font-size="28">🔧</text>
    <text x="126" y="760" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#4d3f48">Hourly Support</text>
