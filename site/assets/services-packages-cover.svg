    </text>
    <text x="425" y="434" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
      custom design · inquiry path
    </text>
  </g>

  <!-- E-Commerce Starter -->
  <g filter="url(#shadow)">
    <rect x="704" y="255" width="285" height="228" rx="28" fill="#f8fbf4" stroke="#dde7d8"/>
    <text x="732" y="308" font-family="Arial, Helvetica, sans-serif" font-size="32">🛍️</text>
    <text x="732" y="352" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#4d3f48">
      E-Commerce Starter
    </text>
    <text x="732" y="392" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#7d9479">
      from $500
    </text>
    <text x="732" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
      Storefront
    </text>
    <text x="732" y="447" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">
