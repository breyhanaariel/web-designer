  <g filter="url(#shadow)">
    <rect x="390" y="250" width="295" height="245" rx="28" fill="#fffdf9" stroke="#e6d6dc"/>
    <text x="418" y="302" font-family="Arial, Helvetica, sans-serif" font-size="31">🌷</text>
    <text x="418" y="344" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#4d3f48">Small Business Site</text>
    <text x="418" y="384" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">from $200</text>
    <text x="418" y="417" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">Up to 10 pages</text>
    <text x="418" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">custom design</text>
    <text x="418" y="463" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#766a72">inquiry path</text>
  </g>

  <g filter="url(#shadow)">
