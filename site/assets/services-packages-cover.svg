    <text x="1068" y="302" font-family="Arial, Helvetica, sans-serif" font-size="31">💗</text>
    <text x="1068" y="344" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#6f485c">Community Starter</text>
    <text x="1068" y="384" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b76086">$50</text>
    <text x="1068" y="416" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7d6470">Select woman-owned, Black-owned,</text>
    <text x="1068" y="438" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#7d6470">or animal-centered</text>
