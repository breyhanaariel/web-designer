<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Brianna Dickenson Web Designer portfolio cover</title>
  <desc id="desc">A feminine pastel portfolio cover featuring DaisyDesk, Fawn and Finch, and Moonpetal House.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4f8"/>
      <stop offset="0.52" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#eef4ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#6d4d5d" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="700" rx="44" fill="url(#bg)"/>
  <circle cx="1220" cy="92" r="150" fill="#f4dbe6" opacity="0.65"/>
  <circle cx="110" cy="620" r="170" fill="#f6e7ca" opacity="0.6"/>
  <text x="92" y="116" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#95677d" letter-spacing="5">WEB DESIGNER PORTFOLIO</text>
  <text x="92" y="210" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#4d3f48">Brianna Dickenson 🎀</text>
  <text x="92" y="264" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#74656d">Brand-led websites · responsive design · business outcomes · accessibility · SEO fundamentals</text>

  <g filter="url(#shadow)">
    <rect x="92" y="345" width="360" height="220" rx="30" fill="#fffdf7" stroke="#eadfdc"/>
    <text x="126" y="405" font-family="Arial, Helvetica, sans-serif" font-size="42">🌼</text>
    <text x="126" y="458" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#4d3f48">DaisyDesk</text>
    <text x="126" y="500" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#766a72">SaaS marketing website</text>
    <text x="126" y="535" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#95677d">Conversion · pricing · product storytelling</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="520" y="320" width="360" height="245" rx="30" fill="#fffdf9" stroke="#eadfdc"/>
    <text x="554" y="385" font-family="Arial, Helvetica, sans-serif" font-size="42">🦌</text>
    <text x="554" y="438" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#4d3f48">Fawn &amp; Finch</text>
    <text x="554" y="480" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#766a72">Fashion e-commerce</text>
    <text x="554" y="515" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#95677d">Art direction · merchandising · CRO</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="948" y="345" width="360" height="220" rx="30" fill="#312f42" stroke="#5f5b72"/>
    <text x="982" y="405" font-family="Arial, Helvetica, sans-serif" font-size="42">🌙</text>
    <text x="982" y="458" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#fffaf0">Moonpetal House</text>
    <text x="982" y="500" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#dfd7e2">Luxury hospitality</text>
    <text x="982" y="535" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e8bfd0">Booking UX · storytelling · SEO</text>
  </g>
</svg>