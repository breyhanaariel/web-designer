<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Poppy and Paws before and after redesign cover</title>
  <desc id="desc">A feminine before-and-after website redesign illustration for the fictional Poppy and Paws pet grooming business.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3f7"/>
      <stop offset="1" stop-color="#eff5e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" rx="44" fill="url(#bg)"/>
  <text x="72" y="90" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#95677d" letter-spacing="4">BEFORE / AFTER REDESIGN</text>
