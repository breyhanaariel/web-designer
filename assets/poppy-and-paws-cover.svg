    <text x="235" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#95878a">Quality service for all your pet needs.</text>
    <rect x="28" y="184" width="388" height="12" rx="6" fill="#d7cbc7"/>
    <rect x="28" y="212" width="330" height="12" rx="6" fill="#d7cbc7"/>
    <rect x="28" y="240" width="370" height="12" rx="6" fill="#d7cbc7"/>
    <g fill="#ddd2ce">
      <rect x="28" y="282" width="120" height="42" rx="8"/>
      <rect x="162" y="282" width="120" height="42" rx="8"/>
      <rect x="296" y="282" width="120" height="42" rx="8"/>
    </g>
  </g>

  <g transform="translate(658 300)">
