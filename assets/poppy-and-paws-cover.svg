    <text x="50" y="151" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#4d3f48">Fresh coats. Happy paws.</text>
    <text x="50" y="184" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#74656d">Clear services, pricing, and one easy booking path.</text>
    <rect x="50" y="196" width="160" height="40" rx="20" fill="#b76086"/>
